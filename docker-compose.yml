name: wmsflow

services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-wmsflow}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wmsflow_db}
      POSTGRES_USER: ${DB_USER:-wmsflow_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wmsflow_pwd}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-44016}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wmsflow_user} -d ${DB_NAME:-wmsflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-wmsflow}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-46316}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-wmsflow}-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-wmsflow_db}
      DB_USER: ${DB_USER:-wmsflow_user}
      DB_PASSWORD: ${DB_PASSWORD:-wmsflow_pwd}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      JWT_EXPIRE_HOURS: "72"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      LOG_LEVEL: info
    ports:
      - "${BACKEND_PORT:-19209}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-wmsflow}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-18709}:80"
    depends_on:
      - backend

volumes:
  db_data:
  redis_data:
